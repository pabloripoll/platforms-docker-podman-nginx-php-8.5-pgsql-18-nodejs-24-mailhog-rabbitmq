services:

  pgsql:
    image: postgres:18-alpine3.24
    container_name: ${COMPOSE_CAAS}
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_CPUS}
          memory: ${COMPOSE_MEMO}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tty: true
    restart: unless-stopped