services:

  pgsql:
    image: ${COMPOSE_CAAS}:${COMPOSE_IMGK}
    pull_policy: never
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CAAS}
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_CPUS}
          memory: ${COMPOSE_MEMO}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tty: true
    restart: unless-stopped