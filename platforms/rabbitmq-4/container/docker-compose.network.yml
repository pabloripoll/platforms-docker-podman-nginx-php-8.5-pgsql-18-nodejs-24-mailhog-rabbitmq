services:

  rabbitmq:
    ports:
      - ${COMPOSE_HOST}::${COMPOSE_PORT}:5672 # AMQP
      - ${COMPOSE_HOST}::${COMPOSE_APP_PORT}:15672 # Management UI
    networks:
      net: {}

networks:
  net:
    driver: bridge
    external: true
    name: ${COMPOSE_CNET}
  default:
    external: true
    name: ${COMPOSE_CNET}